{% extends "base.html" %}
{% block content %}
  <h2>Transport</h2>
  {% for s in schedules %}
    <div class="card">
      <p><strong>Route:</strong> {{ s.route }}</p>
      <p><strong>Time:</strong> {{ s.time }}</p>
      <p><strong>Status:</strong> {{ s.status }}</p>
    </div>
  {% else %}
    <p>No schedules.</p>
  {% endfor %}
{% endblock %}
