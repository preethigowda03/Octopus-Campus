{% extends "base.html" %}
{% block content %}
  <h2>Library</h2>
  <table>
    <thead><tr><th>Title</th><th>Author</th><th>Available</th></tr></thead>
    <tbody>
    {% for b in books %}
      <tr>
        <td>{{ b.title }}</td>
        <td>{{ b.author }}</td>
        <td>{{ "Yes" if b.available else "No" }}</td>
      </tr>
    {% else %}
      <tr><td colspan="3">No books</td></tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
