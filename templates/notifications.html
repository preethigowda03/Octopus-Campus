{% extends "base.html" %}
{% block content %}

  <h2>Notifications</h2>{% for n in notifications %}
<div class="card">
<h4>{{ n.title }}</h4>
<p>{{ n.message }}</p>
<small>
{% if n.created_at %}
{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}
{% else %}
No date
{% endif %}
</small>
</div>
{% else %}
<p>No notifications.</p>
{% endfor %}
{% endblock %}
